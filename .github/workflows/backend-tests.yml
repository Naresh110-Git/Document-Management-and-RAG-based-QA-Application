name: Backend Test Suite

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --extra-index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install -r backend/requirements.txt
          python -m pip install -e backend

      - name: Run test suite
        working-directory: backend
        run: python -m pytest -v

  backend-postgres-integration:
    runs-on: ubuntu-latest
    needs: backend-tests
    strategy:
      matrix:
        python: ["3.12"]
    services:
      postgres:
        image: pgvector/pgvector:pg16
        ports:
          - 5432:5432
        env:
          POSTGRES_DB: rag_db
          POSTGRES_USER: rag_user
          POSTGRES_PASSWORD: rag_password
        options: >-
          --health-cmd "pg_isready -U rag_user -d rag_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --extra-index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install -r backend/requirements.txt
          python -m pip install -e backend

      - name: Run Postgres migrations and integration tests
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://rag_user:rag_password@127.0.0.1:5432/rag_db
          ENVIRONMENT: test
        run: |
          alembic upgrade head
          python -m pytest -v

